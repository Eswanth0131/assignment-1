llm:
  provider: "ollama"
  model: "qwen2.5:7b-instruct"
  temperature: 0
  max_tokens: 4096

embedder:
  provider: "ollama"
  model: "mxbai-embed-large"

index:
  chunk_source: "data/chunks.jsonl"
  graph_store: "data/graph"
  cache: "data/cache"
  community_store: "data/communities"

graph:
  max_depth: 2
  min_cluster_size: 3